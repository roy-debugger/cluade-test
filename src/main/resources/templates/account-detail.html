<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은행 계좌 시뮬레이터 - 계좌 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1>계좌 상세 정보</h1>
                    <a href="/accounts" class="btn btn-secondary">계좌 목록으로</a>
                </div>
                
                <!-- 성공 메시지 -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- 에러 메시지 -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- 계좌 정보 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h4 class="mb-0">계좌 정보</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>계좌번호:</strong> <span th:text="${account.id}"></span></p>
                                <p><strong>예금주:</strong> <span th:text="${account.accountHolder}"></span></p>
                            </div>
                            <div class="col-md-6">
                                <p><strong>현재 잔액:</strong> <span class="text-primary fs-5">₩<span th:text="${#numbers.formatDecimal(account.balance, 0, 'COMMA', 0, 'POINT')}"></span></span></p>
                                <p><strong>개설일:</strong> <span th:text="${#temporals.format(account.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 거래 폼 -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0 text-success">💰 입금</h5>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/accounts/{id}/deposit(id=${account.id})}" method="post">
                                    <div class="mb-3">
                                        <label for="depositAmount" class="form-label">입금액 (원)</label>
                                        <input type="number" class="form-control" id="depositAmount" name="amount" 
                                               min="1" step="1" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="depositDescription" class="form-label">입금 메모</label>
                                        <input type="text" class="form-control" id="depositDescription" name="description" 
                                               placeholder="예: 용돈, 급여 등">
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">입금하기</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0 text-danger">💸 출금</h5>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/accounts/{id}/withdraw(id=${account.id})}" method="post">
                                    <div class="mb-3">
                                        <label for="withdrawAmount" class="form-label">출금액 (원)</label>
                                        <input type="number" class="form-control" id="withdrawAmount" name="amount" 
                                               min="1" step="1" th:max="${account.balance}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="withdrawDescription" class="form-label">출금 메모</label>
                                        <input type="text" class="form-control" id="withdrawDescription" name="description" 
                                               placeholder="예: 생활비, 식비 등">
                                    </div>
                                    <button type="submit" class="btn btn-danger w-100">출금하기</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0 text-warning">💳 송금</h5>
                            </div>
                            <div class="card-body">
                                <div th:if="${#lists.isEmpty(otherAccounts)}" class="alert alert-info">
                                    송금할 수 있는 다른 계좌가 없습니다.
                                </div>
                                <form th:if="${!#lists.isEmpty(otherAccounts)}" th:action="@{/accounts/{id}/transfer(id=${account.id})}" method="post">
                                    <div class="mb-3">
                                        <label for="toAccountId" class="form-label">수취인 계좌</label>
                                        <select class="form-select" id="toAccountId" name="toAccountId" required>
                                            <option value="">계좌를 선택하세요</option>
                                            <option th:each="otherAccount : ${otherAccounts}" 
                                                    th:value="${otherAccount.id}" 
                                                    th:text="|${otherAccount.id}번 - ${otherAccount.accountHolder} (잔액: ₩${#numbers.formatDecimal(otherAccount.balance, 0, 'COMMA', 0, 'POINT')})|">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="transferAmount" class="form-label">송금액 (원)</label>
                                        <input type="number" class="form-control" id="transferAmount" name="amount" 
                                               min="1" step="1" th:max="${account.balance}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="transferDescription" class="form-label">송금 메모</label>
                                        <input type="text" class="form-control" id="transferDescription" name="description" 
                                               placeholder="예: 용돈, 빌린돈 갚기 등">
                                    </div>
                                    <button type="submit" class="btn btn-warning w-100">송금하기</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 거래 내역 -->
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">거래 내역</h4>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-info">
                            거래 내역이 없습니다.
                        </div>
                        
                        <div th:if="${!#lists.isEmpty(transactions)}" class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>일시</th>
                                        <th>거래 유형</th>
                                        <th>금액</th>
                                        <th>메모</th>
                                        <th>상대방 계좌</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="transaction : ${transactions}" 
                                        th:classappend="${transaction.type.name() == 'DEPOSIT' or transaction.type.name() == 'TRANSFER_IN' ? 'table-success' : 'table-danger'}">
                                        <td th:text="${#temporals.format(transaction.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                        <td>
                                            <span th:if="${transaction.type.name() == 'DEPOSIT'}" class="badge bg-success">입금</span>
                                            <span th:if="${transaction.type.name() == 'WITHDRAWAL'}" class="badge bg-danger">출금</span>
                                            <span th:if="${transaction.type.name() == 'TRANSFER_OUT'}" class="badge bg-warning text-dark">송금</span>
                                            <span th:if="${transaction.type.name() == 'TRANSFER_IN'}" class="badge bg-info">입금받음</span>
                                        </td>
                                        <td>
                                            <span th:if="${transaction.type.name() == 'DEPOSIT' or transaction.type.name() == 'TRANSFER_IN'}" class="text-success">+₩</span>
                                            <span th:if="${transaction.type.name() == 'WITHDRAWAL' or transaction.type.name() == 'TRANSFER_OUT'}" class="text-danger">-₩</span>
                                            <span th:text="${#numbers.formatDecimal(transaction.amount, 0, 'COMMA', 0, 'POINT')}"></span>
                                        </td>
                                        <td th:text="${transaction.description}"></td>
                                        <td>
                                            <span th:if="${transaction.type.name() == 'TRANSFER_OUT'}" class="text-muted">
                                                계좌번호: <span th:text="${transaction.targetAccountId}"></span>
                                            </span>
                                            <span th:if="${transaction.type.name() == 'TRANSFER_IN'}" class="text-muted">
                                                계좌번호: <span th:text="${transaction.targetAccountId}"></span>
                                            </span>
                                            <span th:if="${transaction.type.name() == 'DEPOSIT' or transaction.type.name() == 'WITHDRAWAL'}" class="text-muted">-</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
