<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은행 계좌 시뮬레이터 - 계좌 개설</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title mb-0">🏦 새 계좌 개설</h3>
                    </div>
                    <div class="card-body">
                        <!-- 에러 메시지 -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        
                        <form action="/accounts" method="post">
                            <div class="mb-3">
                                <label for="accountHolder" class="form-label">예금주명 *</label>
                                <input type="text" class="form-control" id="accountHolder" name="accountHolder" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="initialDeposit" class="form-label">초기 입금액 (원)</label>
                                <input type="number" class="form-control" id="initialDeposit" name="initialDeposit" 
                                       min="0" step="1" placeholder="0">
                                <div class="form-text">입금액을 입력하지 않으면 0원으로 계좌가 개설됩니다.</div>
                            </div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">계좌 개설</button>
                                <a href="/accounts" class="btn btn-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
