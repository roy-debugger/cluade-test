<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은행 계좌 시뮬레이터 - 계좌 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1 class="mb-4">🏦 은행 계좌 시뮬레이터</h1>
                
                <!-- 성공 메시지 -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <!-- 에러 메시지 -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>계좌 목록</h2>
                    <a href="/accounts/new" class="btn btn-primary">새 계좌 개설</a>
                </div>
                
                <div th:if="${#lists.isEmpty(accounts)}" class="alert alert-info">
                    등록된 계좌가 없습니다. 새 계좌를 개설해보세요.
                </div>
                
                <div th:if="${!#lists.isEmpty(accounts)}" class="row">
                    <div th:each="account : ${accounts}" class="col-md-6 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">계좌번호: <span th:text="${account.id}"></span></h5>
                                <h6 class="card-subtitle mb-2 text-muted" th:text="${account.accountHolder}"></h6>
                                <p class="card-text">
                                    <strong>잔액: ₩<span th:text="${#numbers.formatDecimal(account.balance, 0, 'COMMA', 0, 'POINT')}"></span></strong>
                                </p>
                                <p class="card-text">
                                    <small class="text-muted">개설일: <span th:text="${#temporals.format(account.createdAt, 'yyyy-MM-dd HH:mm')}"></span></small>
                                </p>
                                <a th:href="@{/accounts/{id}(id=${account.id})}" class="btn btn-outline-primary">계좌 상세</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
